name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run check

      - name: Biome lint check
        run: npm run lint

      - name: Verify vendored Paper v0.7.0 SHA-256 manifest
        run: npm run drift:paper

      - name: Run unit, security, migration & ontology test suite
        run: npm test

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production client & server build
        run: npm run build
