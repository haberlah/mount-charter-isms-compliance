name: Legislation or Standard Update
description: Report an amendment, commencement date change, or correction to an encoded standard (ISO, ASD/ACSC, Privacy Act, Cyber Security Act, APRA, SOCI, NAIC).
labels: ["standards"]
body:
  - type: dropdown
    id: framework
    attributes:
      label: Framework / Instrument
      options:
        - ISO/IEC 27001:2022 (+ Amd 1:2024)
        - ACSC Essential Eight / ASD Essentials
        - Privacy Act 1988 / POLA Act 2024
        - Cyber Security Act 2024 (Cth)
        - APRA CPS 234 / CPS 230
        - SOCI Act 2018 (+ ERP Act 2024)
        - NAIC Guidance for AI Adoption (AI6)
        - New Standard Proposal
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Authoritative Source URL
      description: Link to Federal Register of Legislation, ASD/ACSC, OAIC, APRA, or ISO publication.
      placeholder: "https://www.legislation.gov.au/..."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Exact change & effective date
      description: Cite clause/section numbers, commencement date, and whether the change is enacted or an exposure draft (isDraft).
    validations:
      required: true
